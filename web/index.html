<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Explora rutas de transporte público en Cancún y encuentra cómo llegar.">
  <meta name="theme-color" content="#0B4558">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rutas Cancún">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rutas Cancún</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Aviso de descarga.

    La web se mantiene a propósito en una versión anterior: las funciones
    nuevas viven en la app. Cuando la ficha de Play Store esté publicada,
    cambia DISPONIBLE_EN_PLAY a true y vuelve a desplegar; a partir de ahí el
    aviso aparece sobre el mapa, no se puede cerrar y lleva a la descarga.

    Mientras siga en false no se muestra nada: enlazar a una ficha que todavía
    no existe llevaría a un 404.
  -->
  <script>
    (function () {
      var DISPONIBLE_EN_PLAY = false;
      var URL_PLAY =
        'https://play.google.com/store/apps/details?id=com.rutascancun.app';

      if (!DISPONIBLE_EN_PLAY) return;

      var estilo = document.createElement('style');
      estilo.textContent =
        '#rc-descarga{position:fixed;inset:auto 0 0 0;z-index:2147483647;' +
        'background:#0B3B4A;color:#fff;padding:16px 20px;' +
        'font:600 15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;' +
        'display:flex;gap:14px;align-items:center;justify-content:center;' +
        'flex-wrap:wrap;box-shadow:0 -6px 24px rgba(0,0,0,.35)}' +
        '#rc-descarga a{background:#12C29B;color:#06232C;text-decoration:none;' +
        'padding:10px 18px;border-radius:12px;font-weight:800;white-space:nowrap}' +
        '#rc-descarga span{max-width:52ch}';
      document.head.appendChild(estilo);

      var aviso = document.createElement('div');
      aviso.id = 'rc-descarga';
      aviso.setAttribute('role', 'alert');
      aviso.innerHTML =
        '<span>Esta versión web ya no recibe funciones nuevas. ' +
        'Descarga la app para tener las rutas actualizadas, tu cuenta y el ' +
        'planificador de viajes.</span>';

      var boton = document.createElement('a');
      boton.href = URL_PLAY;
      boton.rel = 'noopener';
      boton.textContent = 'Descargar la app';
      aviso.appendChild(boton);

      function montar() {
        if (!document.getElementById('rc-descarga')) document.body.appendChild(aviso);
      }
      montar();

      // Flutter reconstruye el árbol del DOM al arrancar y puede llevarse el
      // aviso por delante. Volver a montarlo es lo que hace que "no se quite".
      new MutationObserver(montar).observe(document.body, { childList: true });
    })();
  </script>
</body>
</html>
